[package]
name = "grafeia_core"
description = "γραφείο – core"
version = "0.1.0"
authors = ["Sebastian K <s3bk@protonmail.com>"]
edition = "2018"

[features]
# `tex` objects need ReX's layout engine *and* a scene to draw a formula into; the
# second half is stage 2, so the object stays out of the build until then.
tex = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
indexmap = { version = "1.9", features = ["serde-1"]}
# `opentype-api` is pdf-rs/font#11 (base `vello`): `parse()` is OpenType-only and
# returns the font itself. Switch back to `branch = "vello"` once #11 is merged.
font = { git = "https://github.com/pdf-rs/font", branch = "opentype-api", features = ["opentype", "woff", "math", "cff"] }
pathfinder_geometry = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_content = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_color = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_renderer = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_export = { git = "https://github.com/s3bk/pathfinder/" }
# `pathfinder-master` is s3bk/vector with Scene::push_path renamed to push_draw_path, as current pathfinder master requires. Merge upstream before dropping it.
vector = { git = "https://github.com/s3bk/vector/", branch = "pathfinder-master", features = ["impl_pathfinder"] }
# ReX is its own repo now; the `vello` branch is the ported one.
rex = { git = "https://github.com/grafeia/ReX", branch = "vello" }
serde = { version = "1.0", features = ["derive", "rc"] }
log = "0.4.8"
usvg = { version = "0.44", default-features = false }
bincode = "1.3"
lazy_static = "1.4.0"
itertools = "0.8.2"
unicode_categories = "*"
unicode-segmentation = "*"
hyphenation = { git = "https://github.com/s3bk/hyphenation" }
instant = { version = "*", features = ["now"] }
