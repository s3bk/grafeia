[package]
name = "grafeia_convert"
description = "γραφείο – converters and demo binaries"
version = "0.1.0"
authors = ["Sebastian K <s3bk@protonmail.com>"]
edition = "2018"

[dependencies]
grafeia_core = { path = "../core", features = ["tex"] }
font = { git = "https://github.com/pdf-rs/font", branch = "opentype-api", features = ["opentype", "woff", "math", "cff"] }
log = "*"
# The 2019 `docx` crate (strong-xml -> jetscii 0.4) no longer compiles on current
# rustc, so the DOCX importer sits behind a feature until it is ported.
docx = { version = "*", optional = true }
pulldown-cmark = "*"
pathfinder_geometry = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_content = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_color = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_renderer = { git = "https://github.com/s3bk/pathfinder/" }
pathfinder_export = { git = "https://github.com/s3bk/pathfinder/" }
env_logger = "*"
# The style file. A style is a table of small facts, and a table is what
# TOML is for.
toml = "0.8"
# `pdf` is the reader and writer; the exporter only uses `build` and `content`.
# Same fork and branch as pdf_render, so both read and write one dialect.
pdf = { git = "https://github.com/s3bk/pdf.git", branch = "master", default-features = false, features = ["cache"], optional = true }

[features]
import-docx = ["dep:docx"]
# The markdown and pdf importers were written against the 2019 pulldown-cmark and
# pathfinder APIs and are not buildable today; the features only exist so the
# binaries stay out of a plain `cargo build`.
markdown = []
# The PDF exporter: subsets and embeds the fonts, and assembles the file with
# the `pdf` crate's builder.
pdf = ["dep:pdf"]

[[bin]]
name = "docx"
path = "src/bin/docx.rs"
required-features = ["import-docx"]

[[bin]]
name = "markdown"
path = "src/bin/markdown.rs"
required-features = ["markdown"]

[[bin]]
name = "grafeia"
path = "src/bin/grafeia.rs"
required-features = ["pdf"]

[[bin]]
name = "svg"
path = "src/bin/svg.rs"
